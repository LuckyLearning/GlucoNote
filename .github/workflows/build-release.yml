name: Build and Release

# 触发规则：
#  · 推送到 main 分支            → 仅编译验证（assembleDebug + 单测），确保提交可构建、逻辑无误
#  · 推送形如 v1.0.0 的 tag      → 构建 Release 包并发布到公共分发仓库 LuckyLearning/Release
#  · Actions 页面手动触发         → 构建 Release 包（需填 version 输入）
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag, e.g. v1.0.0'
        required: true
        default: 'v1.0.0'

permissions:
  contents: read

jobs:
  # ── 推送到 main：只验证能否编译 + 跑通 JVM 单测，不出包 ──
  verify:
    name: Verify build & unit tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub 运行器已预装 Android SDK；直接用 sdkmanager 安装所需平台并同意许可，
      # 不再依赖已失效的 android-actions/setup-android（其会尝试安装已废弃的 tools 包而失败）。
      - name: Set up Android SDK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug & run unit tests
        run: ./gradlew assembleDebug testDebugUnitTest --no-daemon

  # ── 打 tag 或手动触发：构建签名包并发布到公共分发仓库 ──
  release:
    name: Build release & publish to Release repo
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 发版闸门：tag 必须与 app/build.gradle.kts 里的 appVersionName 一致，
      # 否则应用内更新（比对 BuildConfig.VERSION_NAME 与 latest.json）会乱套。
      - name: Check tag & versionName consistency
        env:
          # tag 触发时取 ref_name（v1.0.0）；手动触发时取 inputs.version。
          # 两者都用同一表达式，避免手动触发时把分支名 main 当成版本号。
          TARGET: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          VERSION="${TARGET#v}"
          FILE_VERSION=$(grep -E '^val appVersionName = ' app/build.gradle.kts | head -1 | grep -o '[0-9][0-9.]*')
          echo "target=$TARGET -> version=$VERSION ; appVersionName=$FILE_VERSION"
          if [[ "$VERSION" != "$FILE_VERSION" ]]; then
            echo "::error::版本（$VERSION）与 appVersionName（$FILE_VERSION）不一致"
            echo "::error::请把 app/build.gradle.kts 的 val appVersionName 改为 \"$VERSION\" 后重新打 tag，或用 scripts/release.sh 发版"
            exit 1
          fi

      # 前置校验：缺任一 Secret 时给出明确提示，而不是等到签名阶段抛 KeytoolException
      # （空 KEYSTORE_BASE64 会解出一个 0 字节文件，报错是「Failed to read key  from store ...」，
      #  极难定位；空 KEY_ALIAS 则表现为「Failed to read key 」（key 名是空的））
      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=()
          [[ -n "$KEYSTORE_BASE64"   ]] || missing+=("KEYSTORE_BASE64")
          [[ -n "$KEYSTORE_PASSWORD" ]] || missing+=("KEYSTORE_PASSWORD")
          [[ -n "$KEY_ALIAS"         ]] || missing+=("KEY_ALIAS")
          [[ -n "$KEY_PASSWORD"      ]] || missing+=("KEY_PASSWORD")
          if (( ${#missing[@]} > 0 )); then
            echo "::error::缺少签名相关的 Secrets: ${missing[*]}"
            echo "::error::请在 GlucoNote 仓库 → Settings → Secrets and variables → Actions 中配置"
            echo "::error::说明见 docs/版本与更新.md §8 与 docs/发布与CI.md §4"
            exit 1
          fi
          echo "✓ 签名 Secrets 已配置（KEY_ALIAS=${KEY_ALIAS}）"

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "${{ github.workspace }}/gluconote-release.keystore"
          SIZE=$(stat -c%s "${{ github.workspace }}/gluconote-release.keystore")
          echo "keystore 大小: $SIZE 字节"
          # JKS 文件以 FEEDFACE/FEEDFEEB 开头，PKCS12 以 ASN.1 SEQUENCE (0x30) 开头
          if (( SIZE < 1000 )); then
            echo "::error::解码出的 keystore 只有 $SIZE 字节，KEYSTORE_BASE64 可能不完整或为空"
            exit 1
          fi

      - name: Verify keystore is readable
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          # 先单独验一次，把「密钥库坏了」与「Gradle 配置错了」区分开。
          # -storetype 不写死，让 keytool 自己嗅探 JKS / PKCS12。
          keytool -list -keystore "${{ github.workspace }}/gluconote-release.keystore" \
                  -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" \
            || { echo "::error::keytool 无法读取该 keystore —— 请确认 KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS 三者匹配"; exit 1; }

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/gluconote-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew clean assembleRelease --no-daemon

      # 统一产物命名：GlucoNote-v<版本>.apk（应用内更新按清单里的 file 字段下载）
      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/
          cd dist
          for f in *.apk; do
            [[ "$f" == "GlucoNote-"* ]] || mv "$f" "GlucoNote-${GITHUB_REF_NAME#v}.apk"
          done
          ls -la

      - name: Write release notes
        env:
          TARGET: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          VER="${TARGET#v}"
          cat > /tmp/notes.md <<EOF
          ## 血糖随手记 GlucoNote v${VER}

          发布时间：$(date -u '+%Y-%m-%d %H:%M UTC')

          - 安装包：GlucoNote-${VER}.apk（全架构通用）
          - 更新方式：应用内「我的 → 版本更新 → 检查更新」，或从发布页直接下载
          EOF
          cat /tmp/notes.md

      # 发布到公共分发仓库：latest.json + 版本目录（只保留最近 5 个版本）
      - name: Publish to LuckyLearning/Release
        env:
          VERSION: "${{ github.event.inputs.version || github.ref_name }}"
          # 脚本按这个变量名取 token
          RELEASE_REPO_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          VERSION="${VERSION#v}"
          CODE=$(grep -E '^val appVersionCode = ' app/build.gradle.kts | head -1 | grep -o '[0-9][0-9]*')
          VERSION="$VERSION" CODE="$CODE" NOTES_PATH=/tmp/notes.md DIST_DIR=dist \
            bash scripts/publish-release-repo.sh
