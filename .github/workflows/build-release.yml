name: Build and Release

# 触发规则：
#  · 推送到 main 分支            → 仅编译验证（assembleDebug + 单测），确保提交可构建、逻辑无误
#  · 推送形如 v1.0.0 的 tag      → 构建 Release 包（APK/AAB）并发布到 LuckyLearning/Release
#  · Actions 页面手动触发         → 构建 Release 包（需填 version 输入）
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag, e.g. v1.0.0'
        required: true
        default: 'v1.0.0'

permissions:
  contents: read

jobs:
  # ── 推送到 main：只验证能否编译 + 跑通 JVM 单测，不出包 ──
  verify:
    name: Verify build & unit tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug & run unit tests
        run: ./gradlew assembleDebug testDebugUnitTest --no-daemon

  # ── 打 tag 或手动触发：构建 Release 包并发布到 LuckyLearning/Release ──
  release:
    name: Build release & publish to Release repo
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "${{ github.workspace }}/gluconote-release.keystore"

      - name: Build release artifacts
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/gluconote-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew clean assembleRelease bundleRelease --no-daemon

      - name: Publish to LuckyLearning/Release
        uses: softprops/action-gh-release@v2
        with:
          repository: LuckyLearning/Release
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: gluconote-${{ github.event.inputs.version || github.ref_name }}
          name: GlucoNote ${{ github.event.inputs.version || github.ref_name }}
          body: |
            Automated release of GlucoNote ${{ github.event.inputs.version || github.ref_name }}
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
